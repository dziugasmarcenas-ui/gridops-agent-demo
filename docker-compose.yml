services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: gridops
      POSTGRES_USER: gridops
      POSTGRES_PASSWORD: gridops
    ports:
      - "54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridops -d gridops"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
